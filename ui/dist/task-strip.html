<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>ModelDesk 任务进度</title>
<style>
:root {
  color-scheme: light;
  --bg: #f7eed9;
  --top: #e9d4ad;
  --ink: #3a2617;
  --muted: #785639;
  --line: #b48455;
  --wood: #8c572c;
  --accent: #5437ce;
  --good: #3c633f;
  --error: #96364b;
  font: 12px/1.35 var(--font-sans, system-ui, -apple-system, "PingFang SC", sans-serif);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
:root[data-theme=dark] {
  color-scheme: dark;
  --bg: #16131f;
  --top: #221d31;
  --ink: #f4ead6;
  --muted: #aa9b8d;
  --line: #6b4c35;
  --wood: #6b4c35;
  --accent: #b7a3ff;
  --good: #a2dba8;
  --error: #ff97a3;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
#task-strip {
  --state: var(--muted);
  background: var(--bg); border: 2px solid var(--wood);
  max-height: 240px; display: flex; flex-direction: column; overflow: auto;
}
#task-strip[data-state=active], #task-strip[data-state=recovery_pending] { --state: var(--accent); }
#task-strip[data-state=done] { --state: var(--good); }
#task-strip[data-state=failed] { --state: var(--error); }
.strip-row {
  flex: none; height: 68px; padding: 3px 6px; display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto; gap: 7px; align-items: center;
}
#avatar { width: 36px; height: 36px; image-rendering: pixelated; background: var(--top); box-shadow: 0 0 0 1px var(--line); }
.strip-data { display: grid; gap: 4px; min-width: 0; }
.strip-title { display: flex; gap: 5px; align-items: center; min-width: 0; }
.strip-title strong { color: var(--ink); flex: none; }
#task-title, #latest-log { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#task-title { flex: 1; }
#task-state { color: var(--state); font: 700 10px/1.4 ui-monospace, monospace; white-space: nowrap; }
#latest-log { margin: 0; color: var(--muted); font-family: ui-monospace, monospace; font-size: 10px; }
.strip-meter { overflow: hidden; height: 5px; border-block: 1px solid var(--line); background: var(--top); }
.strip-meter::before { display: block; content: ""; width: 0; height: 100%; background: repeating-linear-gradient(90deg, var(--state) 0 5px, transparent 5px 7px); }
#task-strip[data-state=done] .strip-meter::before { width: 100%; }
#task-strip[data-state=active] .strip-meter::before { width: 45%; }
#task-strip[data-state=active][data-visible=true] .strip-meter::before { animation: activity 1.9s steps(14) infinite; }
#task-strip[data-state=active][data-visible=true] #avatar { animation: nudge 1.4s steps(1) infinite; }
@keyframes activity { from { transform: translateX(-100%); } to { transform: translateX(230%); } }
@keyframes nudge { 50% { transform: translateY(-1px); } }
.strip-actions { display: flex; gap: 3px; }
button { background: var(--top); color: var(--ink); border: 1px solid var(--wood); border-radius: 0; padding: 3px 5px; font: inherit; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button:focus-visible, pre:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
button:disabled { opacity: .55; cursor: default; }
pre, #strip-error { border-top: 1px solid var(--line); padding: 4px 6px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; }
pre { font: 10px/1.4 ui-monospace, monospace; max-height: 160px; }
#strip-error { color: var(--error); max-height: 42px; }
#resume-review > div { border-top: 1px solid var(--line); display: flex; gap: 4px; padding: 3px; }
#resume-diff { max-height: 120px; }
@media (max-width: 420px) {
  .strip-row { gap: 5px; }
  .strip-title { display: grid; grid-template-columns: 1fr auto; row-gap: 0; }
  #task-title { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; }
}

</style>
</head>
<body>
<section id="task-strip" aria-label="任务进度">
  <div class="strip-row">
    <canvas id="avatar" width="36" height="36" aria-hidden="true"></canvas>
    <div class="strip-data">
      <div class="strip-title"><strong id="engine"></strong><span id="task-title">等待任务回执…</span><b id="task-state" role="status"></b></div>
      <div class="strip-meter" aria-hidden="true"></div><p id="latest-log"></p>
    </div>
    <div class="strip-actions">
      <button id="toggle-log" type="button" aria-controls="tail" aria-expanded="false" disabled>日志</button>
      <button id="task-action" type="button" hidden></button>
    </div>
  </div>
  <pre id="tail" tabindex="0" aria-label="最近 15 行任务日志" hidden></pre>
  <div id="strip-error" role="status" hidden></div>
  <section id="resume-review" hidden>
    <pre id="resume-diff" tabindex="0"></pre>
    <div><button id="resume-confirm" type="button">确认续跑</button><button id="resume-dismiss" type="button">取消</button></div>
  </section>
</section>
<script>
'use strict';

class WorkbenchHost {
  constructor(frame = window) {
    this.frame = frame;
    this.peer = frame.parent;
    this.origin = '*';
    this.context = {};
    this.capabilities = {};
    this.pending = new Map();
    this.activeTools = 0;
    this.waitingTools = [];
    this.closed = false;
    this.handlers = new Map();
    this.sequence = 0;
    frame.addEventListener('message', event => this.receive(event));
  }

  on(method, callback) {
    this.handlers.set(method, callback);
  }

  post(message) {
    this.peer.postMessage({ jsonrpc: '2.0', ...message }, this.origin);
  }

  receive(event) {
    if (event.source !== this.peer || (this.origin !== '*' && event.origin !== this.origin)) return;
    const message = event.data;
    if (!message || message.jsonrpc !== '2.0' || Array.isArray(message)) return;
    if ('method' in message) {
      if ('id' in message) {
        if (message.method === 'ping' || message.method === 'ui/resource-teardown') {
          if (message.method === 'ui/resource-teardown') {
            this.closed = true;
            const error = new Error('工作台已关闭');
            for (const pending of this.pending.values()) {
              clearTimeout(pending.timer);
              pending.reject(error);
            }
            this.pending.clear();
            for (const pending of this.waitingTools.splice(0)) pending.reject(error);
            this.handlers.get(message.method)?.();
          }
          this.post({ id: message.id, result: {} });
        } else {
          this.post({ id: message.id, error: { code: -32601, message: 'Method not found' } });
        }
      } else {
        if (message.method === 'ui/notifications/host-context-changed') {
          this.mergeContext(message.params || {});
        }
        this.handlers.get(message.method)?.(message.params || {});
      }
      return;
    }
    const pending = this.pending.get(message.id);
    if (!pending) return;
    clearTimeout(pending.timer);
    this.pending.delete(message.id);
    if (message.error) {
      pending.reject(Object.assign(new Error(message.error.message || '宿主请求失败'), { code: message.error.code }));
    } else if ('result' in message) {
      if (pending.method === 'ui/initialize' && /^https?:\/\//.test(event.origin)) this.origin = event.origin;
      pending.resolve(message.result);
    } else {
      pending.reject(new Error('宿主回包缺少结果'));
    }
  }

  mergeContext(patch) {
    this.context = { ...this.context, ...patch };
  }

  request(method, params = {}, timeout = 25000) {
    const id = ++this.sequence;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        this.pending.delete(id);
        this.post({ method: 'notifications/cancelled', params: { requestId: id, reason: 'timeout' } });
        reject(new Error(method + '：宿主请求超时'));
      }, timeout);
      this.pending.set(id, { resolve, reject, timer, method });
      try { this.post({ id, method, params }); }
      catch (error) {
        clearTimeout(timer);
        this.pending.delete(id);
        reject(error);
      }
    });
  }

  notify(method, params = {}) {
    this.post({ method, params });
  }

  async connect() {
    if (this.peer === this.frame) throw new Error('请在 Antigravity 中打开工作台');
    const result = await this.request('ui/initialize', {
      protocolVersion: '2026-01-26',
      appInfo: { name: 'modeldesk-workbench', version: '2.0.0' },
      appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
    });
    if (result.protocolVersion !== '2026-01-26') throw new Error('宿主 MCP App 协议版本不兼容');
    this.capabilities = result.hostCapabilities || {};
    this.mergeContext(result.hostContext || {});
    this.notify('ui/notifications/initialized');
  }

  getHostCapabilities() { return this.capabilities; }
  getHostContext() { return this.context; }

  static resultData(reply, label) {
    const text = (reply?.content || []).filter(item => item.type === 'text').map(item => item.text);
    if (reply?.isError) throw new Error(text.join('\n') || label + '失败');
    let data = reply?.structuredContent;
    if (data && typeof data === 'object' && !Array.isArray(data)) return data;
    for (const block of text) {
      try { data = JSON.parse(block); } catch { continue; }
      if (data && typeof data === 'object' && !Array.isArray(data)) return data;
    }
    throw new Error(label + '：宿主回包缺少结构化数据');
  }

  async callServerTool(name, args = {}) {
    if (this.closed) throw new Error('工作台已关闭');
    if (this.activeTools >= 4) await new Promise((resolve, reject) => this.waitingTools.push({ resolve, reject }));
    else this.activeTools++;
    try {
      if (this.closed) throw new Error('工作台已关闭');
      const reply = await this.request('tools/call', { name, arguments: args }, name.includes('translate') ? 600000 : 30000);
      return WorkbenchHost.resultData(reply, name);
    } finally {
      const next = this.waitingTools.shift();
      if (next) next.resolve();
      else this.activeTools--;
    }
  }

  sendMessage(content) {
    return this.request('ui/message', { role: 'user', content: [{ type: 'text', text: content }] });
  }

  updateModelContext(content) {
    const block = typeof content === 'string' ? { type: 'text', text: content } : content;
    return this.request('ui/update-model-context', { content: [block] });
  }
}

function applyHostTheme(hostContext, root = document.documentElement, mode = 'auto') {
  const theme = mode === 'light' || mode === 'dark' ? mode : hostContext.theme === 'dark' ? 'dark' : 'light';
  if (root.dataset.theme !== theme) root.dataset.theme = theme;
  const incoming = hostContext.styles?.variables || {};
  const previous = (root.dataset.hostVariables || '').split(' ').filter(Boolean);
  const allowed = Object.entries(incoming).filter(([name, value]) =>
    /^--(?:color-(?:background|text|border)-[a-z0-9-]+|font-sans)$/.test(name) && typeof value === 'string');
  const current = new Set(allowed.map(([name]) => name));
  for (const name of previous) if (!current.has(name)) root.style.removeProperty(name);
  for (const [name, value] of allowed) root.style.setProperty(name, value);
  root.dataset.hostVariables = [...current].join(' ');
}

function isGlobalView(context) {
  const agy = context['com.google.antigravity/ui'] || {};
  return context.displayMode === 'fullscreen' || [context.entrypoint, context.viewType, agy.entrypoint, agy.type]
    .some(entry => entry === 'global' || entry?.type === 'global');
}

async function previewInHost(host, file, fallback) {
  if (!isGlobalView(host.getHostContext())) {
    try {
      const reply = await host.request('com.google.antigravity/toggle-aux-pane', { tabType: 'fileView', uri: file.uri });
      if (!reply?.isError) return;
    } catch (error) {
      if (error.code !== -32601) throw error;
    }
  }
  return fallback();
}

</script>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const root = $('task-strip');
  const host = new WorkbenchHost();
  const running = new Set(['queued', 'dispatching', 'running']);
  const done = new Set(['completed', 'review', 'accepted']);
  const engines = { codex: 'Codex', qoder: 'Qoder CN', gemini: 'Gemini' };
  const sprites = { codex: 'gpt-dragon', qoder: 'dayu', gemini: 'gemini' };
  let task, ready = false, closed = false, working = false, timer, polling = false, generation = 0;
  let lines = [], snapshot, spriteName, review;
  let prefs = {}, observer, followUp = '';

  function notifyError(message = '') {
    $('strip-error').textContent = message;
    $('strip-error').hidden = !message;
  }

  function clock(row) {
    const seconds = Math.max(0, Math.floor(Date.now() / 1000 - (row.started_at || row.created_at || Date.now() / 1000)));
    return String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
  }

  function drawAvatar() {
    const name = prefs.office_desks?.find(row => row.endpoint === task.engine)?.sprite || sprites[task.engine];
    if (name === spriteName) return;
    spriteName = name;
    const sheet = window.ModelDeskOfficeSprites[name];
    if (!sheet) return;
    const image = new Image();
    image.onload = () => {
      const context = $('avatar').getContext('2d');
      if (spriteName !== name || !context) return;
      context.clearRect(0, 0, 36, 36);
      context.imageSmoothingEnabled = false;
      const scale = 32 / Math.max(sheet.w, sheet.h);
      const width = Math.round(sheet.w * scale), height = Math.round(sheet.h * scale);
      context.drawImage(image, 0, 0, sheet.w, sheet.h, Math.round((36 - width) / 2), 34 - height, width, height);
    };
    image.src = sheet.src;
  }

  function render() {
    root.dataset.visible = String(!document.hidden && !closed);
    if (!task) return;
    const status = task.status;
    const active = running.has(status);
    root.dataset.state = active ? 'active' : done.has(status) ? 'done' : status;
    $('engine').textContent = engines[task.engine] || task.engine;
    $('task-title').textContent = task.title || task.id;
    $('task-title').title = task.title || task.id;
    $('task-state').textContent = active ? '[RUN ' + clock(task) + ']' : status === 'recovery_pending' ? '[PAUSED · 可续接]' :
      status === 'review' ? '[待验收]' : status === 'accepted' ? '[已验收 ✓]' :
      done.has(status) ? '[DONE ✓]' : status === 'failed' ? '[FAILED]' : status === 'cancelled' ? '[CANCELLED]' : '';
    $('latest-log').textContent = task.error || lines.at(-1) || '等待执行日志';
    $('tail').textContent = lines.join('\n') || '暂无日志';
    $('toggle-log').disabled = false;
    const action = $('task-action');
    action.hidden = !active && status !== 'recovery_pending';
    action.disabled = working || Boolean(task.stop_reason && active) || Boolean(review);
    action.textContent = active ? (task.stop_reason ? '停止中…' : '暂停') :
      task.native_session_id ? '原会话续接' : '核对断点';
    drawAvatar();
  }

  function accept(next) {
    if (!next?.id || !next.status || !next.engine) return;
    if (task?.id !== next.id) {
      generation++;
      lines = [];
      snapshot = null;
      clearReview();
    } else if (task.updated_at > next.updated_at) return;
    task = next;
    render();
  }

  function schedule() {
    clearTimeout(timer);
    if (ready && !closed && !document.hidden && !working && !polling && running.has(task?.status)) {
      timer = setTimeout(readLogs, 2000);
    }
  }

  async function readLogs() {
    if (!ready || !task || closed || document.hidden || polling || working) return;
    const current = generation;
    polling = true;
    try {
      const data = await host.callServerTool('app_get_task_logs', { task_id: task.id, limit: 15 });
      if (closed || current !== generation || !data.task || data.task.id !== task.id) return;
      lines = (data.text || '').trimEnd().split(/\r?\n/).slice(-15);
      snapshot = data.snapshot;
      accept(data.task);
      notifyError();
    } catch (error) {
      if (!closed && current === generation) notifyError(error.message || '日志读取失败');
    } finally {
      polling = false;
      schedule();
    }
  }

  function clearReview() {
    review = null;
    $('resume-review').hidden = true;
  }

  function showReview(data, action, confirmed) {
    const evidence = data.snapshot || snapshot;
    review = { action, confirmed: action === 'checkpoint' || confirmed, token: data.conflict_token || null };
    $('tail').hidden = true;
    $('toggle-log').setAttribute('aria-expanded', 'false');
    $('resume-diff').textContent = [data.files?.join('\n'), evidence?.diff || evidence?.log || '暂无 Git 差异']
      .filter(Boolean).join('\n\n');
    $('resume-confirm').textContent = action === 'native' ? '确认续接' : '确认断点续跑';
    $('resume-review').hidden = false;
    render();
  }

  async function command(action, confirmed = false, conflict_token = null) {
    if (!task || working || closed || document.hidden) return;
    working = true;
    clearTimeout(timer);
    const current = ++generation;
    render();
    try {
      const data = await host.callServerTool('app_task_action', {
        task_id: task.id, action, confirmed, conflict_token, prompt: followUp,
      });
      if (closed || current !== generation) return;
      if (data.status === 'conflict' || data.status === 'confirmation_required') {
        showReview(data, action, confirmed);
      } else {
        followUp = '';
        clearReview();
        accept(data);
      }
      notifyError();
    } catch (error) {
      if (current === generation && !closed) notifyError(error.message || '任务操作失败');
    } finally {
      working = false;
      render();
      schedule();
    }
  }

  $('toggle-log').addEventListener('click', () => {
    if (review) clearReview();
    $('tail').hidden = !$('tail').hidden;
    $('toggle-log').setAttribute('aria-expanded', String(!$('tail').hidden));
    render();
  });
  $('task-action').addEventListener('click', () => command(running.has(task.status) ? 'pause' :
    task.native_session_id ? 'native' : 'checkpoint'));
  $('resume-confirm').addEventListener('click', () => {
    if (review) command(review.action, review.confirmed, review.token);
  });
  $('resume-dismiss').addEventListener('click', () => { clearReview(); render(); });

  const theme = () => applyHostTheme(host.getHostContext(), document.documentElement, prefs.hud_theme);
  host.on('ui/notifications/host-context-changed', theme);
  host.on('ui/notifications/tool-input', params => {
    followUp = typeof params.arguments?.follow_up_prompt === 'string' ? params.arguments.follow_up_prompt : '';
  });
  host.on('ui/notifications/tool-result', params => {
    let next;
    try { next = WorkbenchHost.resultData(params, '任务回执'); }
    catch (error) { notifyError(error.message); return; }
    if (next?.status === 'conflict' || next?.status === 'confirmation_required') {
      if (next.task) {
        accept(next.task);
        showReview(next, next.resume_mode === 'native' ? 'native' : 'checkpoint', false);
      } else {
        $('task-title').textContent = '续接前需要在工作台核对';
        notifyError('请在工位对话框确认现场后续接。');
      }
      return;
    }
    followUp = '';
    accept(next);
    if (ready && task && !document.hidden) {
      if (running.has(task.status)) schedule();
      else readLogs();
    }
  });
  host.on('ui/notifications/tool-cancelled', () => notifyError('宿主已取消工具调用'));
  host.on('ui/resource-teardown', () => {
    closed = true;
    clearTimeout(timer);
    observer?.disconnect();
    render();
  });
  document.addEventListener('visibilitychange', () => {
    render();
    if (document.hidden) clearTimeout(timer);
    else schedule();
  });

  async function init() {
    await host.connect();
    if (closed) return;
    ready = true;
    theme();
    render();
    if (task && !running.has(task.status)) readLogs();
    else schedule();
    if (typeof ResizeObserver !== 'undefined') {
      let last;
      observer = new ResizeObserver(() => {
        const height = Math.ceil(root.getBoundingClientRect().height);
        const width = document.documentElement.clientWidth;
        const key = width + ':' + height;
        if (!closed && key !== last && height > 0) {
          last = key;
          host.notify('ui/notifications/size-changed', { width, height });
        }
      });
      observer.observe(root);
    }
    try {
      const data = await host.callServerTool('app_dashboard', { conversation_id: task?.conversation_id });
      if (!closed) { prefs = data.prefs || {}; theme(); render(); }
    } catch { /* Initial host theme and default sprite remain available. */ }
  }

  init().catch(error => notifyError(error.message));
})();

</script>
</body>
</html>
